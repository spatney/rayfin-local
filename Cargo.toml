# rayfin-local: run a Rayfin project's backend entirely on the developer's machine.
# One binary (`rayfin-local`) built from the crates below. Shared dependency versions live here; crates
# reference them with `dep.workspace = true` so features unify the same way for every crate.
[workspace]
resolver = "3"
members = ["crates/*"]

[patch.crates-io]
# tiberius 0.12.3 with the two fixes Fabric's SQL endpoints need, each marked "rayfin-local patch": a
# PRELOGIN TRACEID (Fabric refuses logins without one; SQL databases answer with an empty one), and
# redirects to `host\instance` that connect to the host but keep the instance in LOGIN7.
# docs/sql-connectors.md has the details.
tiberius = { path = "vendor/tiberius" }

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
rl-project = { path = "crates/rl-project" }
rl-node = { path = "crates/rl-node" }
rl-model = { path = "crates/rl-model" }
rl-db = { path = "crates/rl-db" }
rl-graphql = { path = "crates/rl-graphql" }
rl-auth = { path = "crates/rl-auth" }
rl-tokens = { path = "crates/rl-tokens" }
rl-functions = { path = "crates/rl-functions" }
rl-connectors = { path = "crates/rl-connectors" }
rl-storage = { path = "crates/rl-storage" }
rl-frontend = { path = "crates/rl-frontend" }
rl-server = { path = "crates/rl-server" }

anyhow = "1.0.104"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "ansi"] }
# `preserve_order`: JSON objects keep insertion order, as JavaScript objects do (selection-set order in
# GraphQL responses, key order in config files).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml = "0.9.34"
toml = "1.1.8"
indexmap = { version = "2.14.2", features = ["serde"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = "0.7.20"
futures-util = "0.3.34"
bytes = "1.12.1"
http = "1"
http-body-util = "0.1.5"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "form", "tokio", "matched-path", "original-uri"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["cors", "fs", "trace", "set-header"] }
# TLS is rustls with ring only (no aws-lc-rs, which needs cmake/nasm on Windows). Processes install ring as
# rustls' default provider before building a client (`rustls::crypto::ring::default_provider().install_default()`).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# TDS for Category A SQL connectors. 0.12 because 0.13's `rustls` feature takes tokio-rustls 0.26 with its
# default features, which pull in aws-lc-rs; 0.12's rustls 0.21 runs on ring alone. Patched: see
# [patch.crates-io].
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "rustls"] }
# Crypto: ring for ES256 signing, RS256 verification, SHA-256, HMAC and randomness; argon2 for passwords.
ring = "0.17.14"
argon2 = "0.6.0"
base64 = "0.23.1"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "collation", "window", "backup", "limits", "serde_json"] }
async-graphql-parser = "7"
url = "2.5.8"
percent-encoding = "2.3.2"
regex = "1.13.1"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
notify = "8.2.0"
which = "8.0.6"
open = "5.3.5"
dunce = "1.0.5"
walkdir = "2.5.0"
mime_guess = "2.0.5"
parking_lot = "0.12.5"
hex = "0.4.3"
tempfile = "3.27.0"
libc = "0.2.191"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies (SQLite's C code included) are optimized even in debug builds, so tests stay fast.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
