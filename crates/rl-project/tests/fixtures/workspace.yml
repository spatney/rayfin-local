# npm-workspace layout: every service lives in its own package.
id: workspace-app
name: workspace-app
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
  data:
    enabled: true
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    assetAccess: public
  functions:
    enabled: true
    auth:
      type: application
    path: packages\functions
  storage:
    enabled: false
    path: packages/storage
