[package]
name = "rl-tokens"
description = "Azure access tokens for the developer's identity (az CLI, the Rayfin CLI's login, env overrides)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rl-node.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `local-offset`: older Azure CLIs only report a token's expiry in local time (`expiresOn`).
time = { workspace = true, features = ["local-offset"] }
tokio.workspace = true
tracing.workspace = true
which.workspace = true

[dev-dependencies]
tempfile.workspace = true
